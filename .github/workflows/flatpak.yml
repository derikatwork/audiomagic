name: Flatpak

on:
  push:  # every branch, so pull requests are covered too
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_ID: io.github.derikatwork.AudioMagic
      MANIFEST: flatpak/io.github.derikatwork.AudioMagic.yml
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak, PipeWire and test tools
        run: |
          # bubblewrap (used by flatpak) needs unprivileged user namespaces
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common \
            pipewire pipewire-bin pipewire-pulse wireplumber dbus-daemon \
            python3-numpy ffmpeg xvfb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: GNOME runtimes on Flathub
        run: flatpak remote-ls --user --runtime --columns=application,branch flathub | grep -E '^org\.gnome\.Platform\s' | sort -V | tail -5

      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/*.yml', 'flatpak/*.json') }}
          restore-keys: flatpak-builder-

      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --ccache \
            --force-clean --repo=repo build-dir "$MANIFEST"
          flatpak build-bundle repo AudioMagic.flatpak "$APP_ID" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -la AudioMagic.flatpak

      # saved even when a later step fails, so the next run doesn't rebuild ffmpeg and PipeWire
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: .flatpak-builder
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: AudioMagic-flatpak
          path: AudioMagic.flatpak
          if-no-files-found: error

      - name: Install the bundle and start PipeWire
        run: |
          flatpak install --user -y --noninteractive AudioMagic.flatpak
          # like a desktop session: Flatpak maps sockets from the real /run/user/<uid>
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo mkdir -p "$XDG_RUNTIME_DIR" && sudo chown "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          dbus-daemon --session --fork --address="unix:path=$XDG_RUNTIME_DIR/bus"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          (pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &)
          sleep 1
          (wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &)
          (pipewire-pulse > "$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &)
          sleep 3
          pw-cli info 0 | grep -m1 version

      - name: Check inside the sandbox
        run: |
          flatpak run --command=sh "$APP_ID" -c 'echo "runtime dir: $XDG_RUNTIME_DIR"; ls -la "$XDG_RUNTIME_DIR";
            pw-dump --no-colors > /tmp/dump.json; echo "pw-dump exit $?"; head -c 300 /tmp/dump.json; echo' || true
          flatpak run --command=python3 "$APP_ID" -c 'import gi; gi.require_version("Gst", "1.0"); from gi.repository import Gst; Gst.init(None); print({e: bool(Gst.ElementFactory.find(e)) for e in "srtsrc tsdemux aacparse avdec_aac opusdec souphttpsrc hlsdemux uridecodebin pipewiresrc pulsesink".split()})' || true
          flatpak run "$APP_ID" --check

      - name: Record, monitor, play and export inside the sandbox
        run: python3 flatpak/smoke_test.py

      - name: Open the window (virtual display)
        run: |
          Xvfb :99 -screen 0 1400x900x24 &
          sleep 2
          DISPLAY=:99 flatpak run "$APP_ID" --debug > gui.log 2>&1 &
          sleep 25
          ffmpeg -loglevel error -y -f x11grab -video_size 1400x900 -i :99 -frames:v 1 window.png
          # the app is a child of the sandbox's init process
          flatpak ps --columns=application,child-pid | awk -v app="$APP_ID" '$1 == app {print $2}' | xargs -r -n1 pkill -TERM -P
          sleep 3
          cat gui.log
          grep -q "interface connected" gui.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            window.png
            gui.log
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
